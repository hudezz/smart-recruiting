# In-memory H2 database. DB_CLOSE_DELAY=-1 keeps it alive for the life of the app
# instead of tearing down as soon as the last connection closes.
spring.application.name=smart-recruiting

spring.datasource.url=jdbc:h2:mem:recruitmentdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Run data.sql (seed job listings/applicants) after Hibernate creates the schema,
# not before — otherwise the insert statements would fail with "table not found".
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Lets you inspect the in-memory DB at runtime via a browser.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
